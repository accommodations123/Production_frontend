# ──────────────────────────────────────────────────────────────
# nginx.conf — Frontend SPA (nextkinlife.live)
# Serves the Vite-built static SPA with strict security headers.
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security Headers ─────────────────────────────────────

    # CSP: Vite bundles all JS into external hashed files (no inline scripts).
    # 'unsafe-inline' is required ONLY for style-src because Vite injects CSS
    # via inline <style> tags in production builds — this is standard Vite
    # behavior and does NOT weaken script security.
    # No 'unsafe-eval' is needed — no library in this project uses eval().
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src 'self'; "
        "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
        "img-src 'self' data: blob: https://*.cloudfront.net https://*.s3.amazonaws.com; "
        "media-src 'self' https://*.cloudfront.net https://*.s3.amazonaws.com; "
        "connect-src 'self' https://api.nextkinlife.live wss://api.nextkinlife.live; "
        "font-src 'self' https://fonts.gstatic.com; "
        "frame-ancestors 'none'; "
        "object-src 'none'; "
        "base-uri 'self'; "
        "form-action 'self'; "
        "upgrade-insecure-requests"
        always;

    # Clickjacking protection (redundant with frame-ancestors, but belt-and-suspenders)
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing (e.g., treating a JSON response as executable JS)
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer policy — don't leak full URLs to third-party origins
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy — disable unused browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

    # ── Cache headers for static assets ──────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Re-apply security headers (nginx add_header in a location block
        # overrides parent-level add_header, so we must repeat them here)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}