# ──────────────────────────────────────────────────────────────
# nginx.conf — Frontend SPA (nextkinlife.live)
# Production-hardened config for serving the Vite-built SPA.
# ──────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version from response headers
    server_tokens off;

    # Optimized connection handling
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;

    # ── Gzip Compression ────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # ── Rate Limiting ───────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Apply rate limiting with burst allowance
        limit_req zone=general burst=100 nodelay;

        # ── SPA fallback ────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Security Headers ────────────────────────────────

        # CSP: Vite bundles all JS into external hashed files (no inline scripts).
        # 'unsafe-inline' is required ONLY for style-src because Vite injects CSS
        # via inline <style> tags in production builds — this is standard Vite
        # behavior and does NOT weaken script security.
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self'; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "img-src 'self' data: blob: https://*.cloudfront.net https://*.s3.amazonaws.com; "
            "media-src 'self' https://*.cloudfront.net https://*.s3.amazonaws.com; "
            "connect-src 'self' http://35.153.223.230:5000 ws://35.153.223.230:5000 http://35.153.223.230:5000 wss://api.nextkinlife.live https://ipapi.co https://api.postalpincode.in; "
            "font-src 'self' https://fonts.gstatic.com; "
            "frame-src https://maps.google.com https://www.google.com; "
            "frame-ancestors 'none'; "
            "object-src 'none'; "
            "base-uri 'self'; "
            "form-action 'self'; "
            always;

        # Clickjacking protection (redundant with frame-ancestors, but belt-and-suspenders)
        add_header X-Frame-Options "DENY" always;

        # Prevent MIME-type sniffing
        add_header X-Content-Type-Options "nosniff" always;

        # Referrer policy — don't leak full URLs to third-party origins
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions policy — disable unused browser features
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;

        # ── Cache headers for static assets ─────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";

            # Disable access logging for static assets (reduces I/O)
            access_log off;

            # Re-apply ALL security headers (nginx add_header in a child location
            # block silently drops parent-level headers)
            add_header Content-Security-Policy
                "default-src 'self'; "
                "script-src 'self'; "
                "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
                "img-src 'self' data: blob: https://*.cloudfront.net https://*.s3.amazonaws.com; "
                "media-src 'self' https://*.cloudfront.net https://*.s3.amazonaws.com; "
                "connect-src 'self' http://35.153.223.230:5000 ws://35.153.223.230:5000 http://35.153.223.230:5000 wss://api.nextkinlife.live https://ipapi.co https://api.postalpincode.in; "
                "font-src 'self' https://fonts.gstatic.com; "
                "frame-src https://maps.google.com https://www.google.com; "
                "frame-ancestors 'none'; "
                "object-src 'none'; "
                "base-uri 'self'; "
                "form-action 'self'; "
                always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
        }

        # ── Health check endpoint for container orchestration ─
        location = /health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}